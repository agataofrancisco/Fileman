name: livre
description: Gestor inteligente de armazenamento Android (pt-AO). Flutter + Kotlin nativo + backend Go.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  go_router: ^14.2.0
  riverpod: ^2.6.1
  hooks_riverpod: ^2.5.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.0
  file_picker: ^8.0.3
  image_picker: ^1.1.1
  google_ml_kit: ^0.17.0
  crypto: ^3.0.5
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed: ^2.5.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.24.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
